name: Keep backend warm

# Render's free tier spins the backend down after ~15 min of inactivity, and the
# cold start that follows takes ~1 min. This worker pings the cheap /api/health
# endpoint on a schedule so the instance stays awake and the app loads fast.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (GitHub may delay this a few min)
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          url="${KEEP_WARM_URL:-https://varsel-hari.onrender.com/api/health}"
          echo "Pinging $url"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 --retry 3 --retry-all-errors "$url")
          echo "HTTP $code"
          [ "$code" = "200" ]
        env:
          KEEP_WARM_URL: ${{ vars.KEEP_WARM_URL }}
